# 崽崽打卡站 —— Nginx 反向代理配置
# 部署位置：/etc/nginx/conf.d/zaizaidaka.conf
# 生效方式：nginx -t && systemctl reload nginx
# 前置条件：证书已放到 /etc/nginx/ssl/（见 setup-https.sh）

# ---------- 80 端口：全部跳到 https，仅保留证书续期用的 challenge 目录 ----------
server {
    listen 80;
    listen [::]:80;
    server_name zaizaidaka.site www.zaizaidaka.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 端口：反代到后端 127.0.0.1:8001 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zaizaidaka.site www.zaizaidaka.site;

    # 腾讯云免费 DV 证书，下载后是 xxx_bundle.crt + xxx.key
    ssl_certificate     /etc/nginx/ssl/zaizaidaka.site_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/zaizaidaka.site.key;

    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/zaizaidaka.access.log;
    error_log  /var/log/nginx/zaizaidaka.error.log;

    # 头像以 base64 提交，留足请求体余量
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
